# Publică folderul web/ pe GitHub Pages la fiecare push pe main care atinge web/.
# Pași manuali o singură dată: Settings → Pages → Source: GitHub Actions.

name: Publicare GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă repo-ul
        uses: actions/checkout@v7
      - name: Încarcă folderul web/ ca artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publică pe GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
